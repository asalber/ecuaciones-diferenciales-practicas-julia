project:
  type: book
  output-dir: "docs"
  preview:
    port: 1313
    browser: false

engine: jupyter

execute:
  freeze: auto
  cache: true
  daemon: 3600
  fig-format: png

website:
  favicon: "img/logos/favicon.ico"
  reader-mode: true
  comments: 
    hypothesis:
      theme: clean
      openSidebar: true

book:
  title: "Prácticas de Ecuaciones Diferenciales y Ecuaciones en Derivadas Parciales con Julia"
  author: "Alfredo Sánchez Alberca"
  date: "1/6/2026"
  output-file: "practicas-ecuaciones-diferenciales-derivadas-parciales-julia"
  image: img/logos/sticker.png
  cover-image: img/logos/sticker.png
  sharing: [linkedin]
  downloads: [pdf, epub]
  favicon: "img/logos/favicon.ico"
  sidebar: 
    logo: img/logos/aprendeconalf.png
    tools:
      - icon: house-fill
        href: https://aprendeconalf.es
  open-graph: true
  chapters:
    - index.qmd
    - 01-edos-primer-orden.qmd
    - 02-geometria-sistemas.qmd
    - 03-sistemas-lineales.qmd
    - 04-ecuaciones-orden-superior.qmd
    - 05-sistemas-no-lineales.qmd
    - 06-sistemas-dinamicos-discretos.qmd
    - 07-edp-primer-orden.qmd
    - 08-edp-segundo-orden.qmd
    # - 09-funcion-green.qmd
    # - 10-caos.qmd
    # - 11-aplicaciones.qmd

format:
  html:
    highlight-style: a11y
    theme:
      dark: darkly
      light: flatly
    html-math-method: mathjax
    default-image-extension: svg
    code-overflow: wrap
    toc: false
  
  pdf:
    documentclass: scrreport
    papersize: a4
    template-partials:
      - before-body.tex
    titlegraphic: img/logos/sticker.png
    institution: CEU San Pablo
    email: asalber@ceu.es
    web: https://aprendeconalf.es
    logo: img/logos/aprendeconalf.png
    include-in-header:
      - preamble.tex
      - macros.tex
    keep-tex: true
  
  epub:
    cover-image: img/logos/sticker.png
    html-math-method: mathml
    toc: true
